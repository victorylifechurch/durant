<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Victory Life Durant — This Week</title>
<meta name="description" content="This week's top announcements from Victory Life Durant.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --black:#000000;
    --gray:#4A4A4A;
    --line:#000000;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--black);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    padding:44px 20px 60px;
  }
  header{
    text-align:center;
    margin-bottom:34px;
  }
  .avatar{
    width:64px;
    height:64px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    margin:0 auto 16px;
    border:1px solid rgba(0,0,0,0.08);
  }
  h1{
    font-weight:700;
    font-size:22px;
    line-height:1.25;
    margin:0 0 6px;
    color:var(--black);
  }
  .week-of{
    font-size:13px;
    font-weight:500;
    color:var(--gray);
    margin:0;
  }
  .board{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .note{
    background:#FFFFFF;
    border:1.5px solid var(--line);
    border-radius:16px;
    padding:18px 20px;
    text-align:left;
  }
  .note-top{
    display:flex;
    align-items:center;
    gap:10px;
    margin:0 0 10px;
  }
  .note-num{
    flex:none;
    width:26px;
    height:26px;
    border-radius:8px;
    background:var(--black);
    color:#FFFFFF;
    font-weight:700;
    font-size:13px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .note h2{
    font-weight:700;
    font-size:16px;
    line-height:1.3;
    margin:0;
    color:var(--black);
  }
  .note p{
    font-size:14px;
    line-height:1.55;
    margin:0;
    color:var(--gray);
  }
  .note a.cta{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:14px;
    font-size:13px;
    font-weight:700;
    color:#FFFFFF;
    background:var(--black);
    text-decoration:none;
    padding:8px 14px;
    border-radius:10px;
  }
  .note a.cta:hover{opacity:0.82;}
  footer{
    margin-top:40px;
    text-align:center;
  }
  footer a{
    display:inline-block;
    font-size:13px;
    font-weight:600;
    color:var(--black);
    text-decoration:none;
    border-bottom:1.5px solid var(--black);
    padding-bottom:3px;
  }
  footer a:hover{opacity:0.6;}
  .empty{
    text-align:center;
    color:var(--gray);
    font-size:14px;
    padding:36px 20px;
    border:1.5px dashed var(--line);
    border-radius:16px;
  }
  @media (max-width:400px){
    .wrap{padding:36px 16px 48px;}
    .note{padding:16px 16px;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <img class="avatar" src="https://cdn2.lnk.bi/profilepics/-2854230_20260825321.png" alt="Victory Life Durant">
      <h1 id="church-name">Church Name</h1>
      <p class="week-of" id="week-of">Week of —</p>
    </header>

    <main class="board" id="board" aria-label="This week's announcements"></main>

    <footer>
      <a href="https://lnk.bio/vlchurch">More links &amp; ministries</a>
    </footer>
  </div>

  <script src="content.js"></script>
  <script>
    (function(){
      var nameEl = document.getElementById('church-name');
      var weekEl = document.getElementById('week-of');
      var board = document.getElementById('board');

      if (typeof CHURCH !== 'undefined') {
        nameEl.textContent = CHURCH.name || 'Church Name';
        weekEl.textContent = 'Week of ' + (CHURCH.weekOf || '—');
      }

      var items = (typeof ANNOUNCEMENTS !== 'undefined') ? ANNOUNCEMENTS.slice(0,3) : [];

      if (!items.length) {
        var empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'No announcements posted yet — check back soon.';
        board.appendChild(empty);
        return;
      }

      var digits = ['1','2','3'];
      items.forEach(function(item, i){
        var note = document.createElement('article');
        note.className = 'note';

        var top = document.createElement('div');
        top.className = 'note-top';

        var chip = document.createElement('span');
        chip.className = 'note-num';
        chip.textContent = digits[i] || (i+1);
        chip.setAttribute('aria-hidden', 'true');
        top.appendChild(chip);

        var h2 = document.createElement('h2');
        h2.textContent = item.title || '';
        top.appendChild(h2);
        note.appendChild(top);

        var p = document.createElement('p');
        p.textContent = item.detail || '';
        note.appendChild(p);

        if (item.link && item.link.url) {
          var a = document.createElement('a');
          a.className = 'cta';
          a.href = item.link.url;
          a.textContent = item.link.label || 'Learn more';
          note.appendChild(a);
        }

        board.appendChild(note);
      });
    })();
  </script>
</body>
</html>
