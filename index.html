<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Victory Life Durant — This Week</title>
<meta name="description" content="This week's top announcements from Victory Life Durant.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --black:#000000;
    --gray:#4A4A4A;
    --line:#000000;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--black);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    padding:44px 20px 60px;
  }
  header{
    text-align:center;
    margin-bottom:34px;
  }
  .avatar{
    width:64px;
    height:64px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    margin:0 auto 16px;
    border:1px solid rgba(0,0,0,0.08);
  }
  h1{
    font-weight:700;
    font-size:22px;
    line-height:1.25;
    margin:0 0 6px;
    color:var(--black);
  }
  .week-of{
    font-size:13px;
    font-weight:500;
    color:var(--gray);
    margin:0;
  }
  .board{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .note{
    background:#FFFFFF;
    border:1.5px solid var(--line);
    border-radius:16px;
    padding:0;
    text-align:left;
    overflow:hidden;
  }
  .note summary{
    list-style:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:10px;
    padding:16px 18px;
    -webkit-tap-highlight-color:transparent;
  }
  .note summary::-webkit-details-marker{display:none;}
  .note summary::marker{content:none;}
  .note summary:focus-visible{outline:2px solid var(--black); outline-offset:-2px;}
  .note-num{
    flex:none;
    width:26px;
    height:26px;
    border-radius:8px;
    background:var(--black);
    color:#FFFFFF;
    font-weight:700;
    font-size:13px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .note-title{
    flex:1;
    font-weight:700;
    font-size:16px;
    line-height:1.3;
    color:var(--black);
  }
  .chevron{
    flex:none;
    width:14px;
    height:14px;
    transition:transform 0.18s ease;
    color:var(--black);
  }
  .note[open] .chevron{transform:rotate(180deg);}
  .note-body{
    padding:0 18px 18px 54px;
  }
  .note-body p{
    font-size:14px;
    line-height:1.55;
    margin:0;
    color:var(--gray);
  }
  .note-body ul{
    margin:10px 0 0;
    padding:0;
    list-style:none;
  }
  .note-body li{
    font-size:13px;
    font-weight:600;
    color:var(--black);
    padding:6px 10px;
    background:#F4F4F4;
    border-radius:8px;
    margin:0 0 6px;
  }
  .note-body li:last-child{margin-bottom:0;}
  .note a.cta{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:14px;
    font-size:13px;
    font-weight:700;
    color:#FFFFFF;
    background:var(--black);
    text-decoration:none;
    padding:8px 14px;
    border-radius:10px;
  }
  .note a.cta:hover{opacity:0.82;}
  footer{
    margin-top:40px;
    text-align:center;
  }
  footer a{
    display:inline-block;
    font-size:13px;
    font-weight:600;
    color:var(--black);
    text-decoration:none;
    border-bottom:1.5px solid var(--black);
    padding-bottom:3px;
  }
  footer a:hover{opacity:0.6;}
  .empty{
    text-align:center;
    color:var(--gray);
    font-size:14px;
    padding:36px 20px;
    border:1.5px dashed var(--line);
    border-radius:16px;
  }
  @media (max-width:400px){
    .wrap{padding:36px 16px 48px;}
    .note{padding:16px 16px;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <img class="avatar" src="https://cdn2.lnk.bi/profilepics/-2854230_20260825321.png" alt="Victory Life Durant">
      <h1 id="church-name">Church Name</h1>
      <p class="week-of" id="week-of">Week of —</p>
    </header>

    <main class="board" id="board" aria-label="This week's announcements"></main>

    <footer>
      <a href="https://lnk.bio/vlchurch">More links &amp; ministries</a>
    </footer>
  </div>

  <script src="content.js"></script>
  <script>
    (function(){
      var nameEl = document.getElementById('church-name');
      var weekEl = document.getElementById('week-of');
      var board = document.getElementById('board');

      if (typeof CHURCH !== 'undefined') {
        nameEl.textContent = CHURCH.name || 'Church Name';
        weekEl.textContent = 'Week of ' + (CHURCH.weekOf || '—');
      }

      var items = (typeof ANNOUNCEMENTS !== 'undefined') ? ANNOUNCEMENTS.slice(0,3) : [];

      if (!items.length) {
        var empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'No announcements posted yet — check back soon.';
        board.appendChild(empty);
        return;
      }

      var digits = ['1','2','3'];
      var chevronSvg = '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>';

      items.forEach(function(item, i){
        var note = document.createElement('details');
        note.className = 'note';
        if (i === 0) note.setAttribute('open', '');

        var summary = document.createElement('summary');

        var chip = document.createElement('span');
        chip.className = 'note-num';
        chip.textContent = digits[i] || (i+1);
        chip.setAttribute('aria-hidden', 'true');
        summary.appendChild(chip);

        var title = document.createElement('span');
        title.className = 'note-title';
        title.textContent = item.title || '';
        summary.appendChild(title);

        var chevronWrap = document.createElement('span');
        chevronWrap.innerHTML = chevronSvg;
        summary.appendChild(chevronWrap.firstChild);

        note.appendChild(summary);

        var body = document.createElement('div');
        body.className = 'note-body';

        var p = document.createElement('p');
        p.textContent = item.detail || '';
        body.appendChild(p);

        if (item.items && item.items.length) {
          var ul = document.createElement('ul');
          item.items.forEach(function(line){
            var li = document.createElement('li');
            li.textContent = line;
            ul.appendChild(li);
          });
          body.appendChild(ul);
        }

        if (item.link && item.link.url) {
          var a = document.createElement('a');
          a.className = 'cta';
          a.href = item.link.url;
          a.textContent = item.link.label || 'Learn more';
          body.appendChild(a);
        }

        note.appendChild(body);
        board.appendChild(note);
      });
    })();
  </script>
</body>
</html>
